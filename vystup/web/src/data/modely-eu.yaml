# Čínské otevřené modely hostované v EU — zdroj dat pro /modely/eu/
# a stránky modelů.
# Každý model má svou stránku src/content/docs/modely/eu/<slug>.mdx (CZ i SK),
# hlídá scripts/kontrola-obsahu.mjs. Ceny NEJSOU tady — drží je
# poskytovatele.yaml (u každého poskytovatele, s odkazem na slug modelu).
#
# Záměrně jen čínské otevřené modely (GLM, DeepSeek, Kimi, MiniMax, Qwen):
# za svou cenu jsou dnes nejsilnější a evropské brány Melious a Cortecs je
# provozují v EU s nulovým uchováváním dat (ZDR) — data do Číny nejdou.
# Evropské a americké otevřené modely (Mistral, Gemma, gpt-oss, Llama…)
# jsme vyřadili: pro práci v OpenWorku za stejné peníze zaostávají.
# Základnou katalogu je nabídka Melious: model patří do katalogu, jen když
# ho Melious nabízí. Cortecs a zahraniční brány uvádíme pro srovnání ceny.
# Starší generace z nabídky Melious (GLM 5.1/5, Kimi K2.5, MiniMax M2.x,
# DeepSeek V3.2/R1, Qwen3 a Qwen2.5) do katalogu záměrně nedáváme.
#
# doporuceni: doporucujeme — štítek „Doporučujeme". Mají ho JEN modely,
# které výslovně vybral provozovatel webu (DeepSeek V4.1 Flash, DeepSeek V4
# Flash 0731, GLM 5.3 Flash): cenou odpovídají běžnému použití v OpenWorku.
# Ostatní jsou druhotná volba a pole nemají. Jiné úrovně štítků nepoužíváme.
#
# Pole s příponou _sk jsou slovenské varianty (volitelné).

last_verified: 2026-09-24
zmenovnik:
  - datum: 2026-09-24
    zmena: "Štítek Doporučujeme jen u DeepSeek V4.1 Flash, DeepSeek V4 Flash a GLM 5.3 Flash; ostatní modely jsou druhotná volba bez štítku."
  - datum: 2026-09-24
    zmena: "Výchozí doporučený model změněn na DeepSeek V4.1 Flash (dříve GLM 5.3 Flash)."
  - datum: 2026-09-24
    zmena: "Založení katalogu: 15 čínských otevřených modelů z nabídky Melious (výpočet v EU, nulové uchovávání dat), se štítkem doporučení, vstupy a kontextem."

