# Katalog modelů — zdroj dat pro /modely/katalog
# Sledujeme jen brány, které web doporučuje: OpenCode Go/Zen, OpenRouter, Cortecs.
# Fakta ověřujeme na třech místech: https://opencode.ai/docs/go/ (nabídka Go),
# https://opencode.ai/docs/zen/ (nabídka a ceny Zen),
# https://openrouter.ai/api/v1/models (vstupy/modality a ceny).
# Vstupy = co model přijme. Výstup je vždy text (soubory z něj tvoří agent).

last_verified: 2026-08-31
zmenovnik:
  - datum: 2026-08-31
    zmena: "Založení katalogu: 13 modelů, vstupy (text/obrázek/zvuk/video) ověřeny z OpenRouter API, dostupnost z dokumentace OpenCode Go/Zen."

sloupce:
  - model
  - vyrobce
  - vstupy
  - vhodne_pro
  - kde_dostupny
  - zdroj
  - overeno

