# Poskytovatelé AI modelů — zdroj dat pro /modely/poskytovatele/ (přehled
# i podstránky), srovnání ZDR a stránky modelů (kde model vezmete + cena).
# Každý poskytovatel má stránku src/content/docs/modely/poskytovatele/<slug>.mdx
# (CZ i SK) — hlídá scripts/kontrola-obsahu.mjs.
#
# Zásady:
# - Záměrně jen pět bran, které se v OpenWorku snadno připojí a má je
#   smysl doporučit běžným lidem: evropské Melious a Cortecs (evropsky: true)
#   a zahraniční OpenCode Go, OpenCode Zen a OpenRouter. Další evropské
#   cloudy (Scaleway, OVHcloud, IONOS…) jsme vyřadili — pro snadné použití
#   se nehodí (viz poznamky-agenta.md).
# - Každé tvrzení má zdroj v poli `zdroje`. Sporné → „nejasné", nikdy dohad.
# - Ceny: za 1 milion tokenů (vstup / výstup) v měně poskytovatele, bez DPH.
#   `model` = slug z modely-eu.yaml (pak se model propojí se svou stránkou),
#   nebo volný název u modelů mimo evropský katalog.
# - doporuceni: stejné úrovně jako u modelů (viz modely-eu.yaml).
# - Pole s příponou _sk jsou slovenské varianty (volitelné).

