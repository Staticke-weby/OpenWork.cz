    region_vypoctu: "USA"
    dpa: "nejasné"
    zdroj: "https://opencode.ai/docs/zen/"
    overeno: 2026-08-31
    poznamka: "referenční řádek doporučené cesty; free modely mohou trénovat na datech"

  - poskytovatel: "Cortecs"
