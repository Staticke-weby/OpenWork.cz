# Bezplatné úrovně poskytovatelů — zdroj dat pro /kolik-to-stoji/bezplatne-urovne
# Pravidla: každý řádek má zdroj (odkaz) a datum ověření. Bez zdroje řádek nezveřejňujeme.
# Limity bezplatných úrovní se často mění — ověřovat průběžně.

last_verified: 2026-08-31
zmenovnik:
  - datum: 2026-08-31
    zmena: "Ověřeny limity Groq, Cerebras, OpenRouter a bezplatné modely OpenCode Zen z veřejných zdrojů."
  - datum: 2026-08-30
    zmena: "Založení souboru, ukázkové řádky."

sloupce:
  - poskytovatel
  - modely_zdarma
  - limit
  - karta_nutna
  - data_k_treninku
  - typ            # trvala_uroven | jednorazovy_kredit
  - zdroj
  - overeno

radky:
  - poskytovatel: "Groq"
    modely_zdarma: "Llama, Mistral Saba, Qwen 3, Kimi K2, GPT-OSS 120B a další"
    limit: "30 požadavků/min, 14 400 požadavků/den, 6 000 tokenů/min (dle modelu)"
    karta_nutna: ne
    data_k_treninku: "nejasné — ověřit v podmínkách"
    typ: trvala_uroven
    zdroj: "https://console.groq.com/docs/rate-limits"
    overeno: 2026-08-31

  - poskytovatel: "Cerebras"
    modely_zdarma: "modely na platformě Cerebras (Llama a další)"
    limit: "1 000 000 tokenů/den, 30 požadavků/min, kontext do 8 000 tokenů"
    karta_nutna: ne
    data_k_treninku: "nejasné — ověřit v podmínkách"
    typ: trvala_uroven
    zdroj: "https://inference-docs.cerebras.ai/"
    overeno: 2026-08-31

  - poskytovatel: "OpenCode Zen (bezplatné modely)"
    modely_zdarma: "Big Pickle, MiMo-V2.5 Free, Ling 3.0 Flash Fin Free, Nemotron 3 Ultra/3.5 Lightning Free, Muse Spark 1.2 Contributor Free (rotují)"
    limit: "nejasné — uvádět s datem"
    karta_nutna: "nejasné"
    data_k_treninku: "u některých ano — free modely mohou trénovat na datech, Nemotron loguje záznamy"
    typ: trvala_uroven
    zdroj: "https://opencode.ai/docs/zen/"
    overeno: 2026-08-31

  - poskytovatel: "OpenRouter (bezplatná řada)"
    modely_zdarma: "desítky modelů s příponou :free (rotují)"
    limit: "20 požadavků/min; 50 požadavků/den (do útraty 10 $), pak 1 000/den"
    karta_nutna: ne
    data_k_treninku: "liší se podle modelu — ověřit"
    typ: trvala_uroven
    zdroj: "https://openrouter.ai/"
    overeno: 2026-08-31
