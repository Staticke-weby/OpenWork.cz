<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenWork.cz">
  <title>OpenWork.cz</title>
  <!-- Favicon je jediná výjimka z pravidla „žádné obrázky" (viz AGENTS.md).
       Barvy jsou zde pevné záměrně — favicon je samostatný soubor bez přístupu
       k CSS proměnným webu. Monogram OW = prstenec O propletený s tahovým W. -->
  <defs>
    <linearGradient id="fav-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26997f" />
      <stop offset="1" stop-color="#166853" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#fav-grad)" />
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="16.5" r="5" />
    <path d="M14.6 11.5 L16.8 21 L19 15 L21.2 21 L23.4 11.5" />
  </g>
</svg>
