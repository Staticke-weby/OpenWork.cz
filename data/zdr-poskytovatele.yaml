# ZDR — nulové uchovávání dat: zdroj dat pro /vase-data/zdr/tabulka
# Tři různé věci, které se pletou: (1) trénink na datech, (2) uchovávání
# záznamů, (3) kde fyzicky běží výpočet. Tabulka je drží oddělené.
# Každá buňka s tvrzením má zdroj. Sporné → "nejasné" + odkaz, nikdy dohad.

last_verified: 2026-08-30
zmenovnik:
  - datum: 2026-08-30
    zmena: "Založení souboru, ukázkové řádky — NEOVĚŘENO, nezveřejňovat bez kontroly."

sloupce:
  - poskytovatel
  - trenink_na_datech      # ano | ne | nejasné | liší se (poznámka)
  - uchovavani_zaznamu     # dny / "žádné" / nejasné
  - zdr_dostupne           # výchozí | na vyžádání | smluvně | ne
  - region_vypoctu
  - dpa                    # ano | ne | nejasné
  - zdroj
  - overeno
  - poznamka

radky:
